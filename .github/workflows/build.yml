name: build-filen-cli-armv7

# Cross-compiles filen-cli from the upstream filen-rs repo for 32-bit ARM Android
# Run it from the Actions tab or: gh workflow run build.yml -R koedx/filen-cli-armv7
# STATUS: UNVERIFIED -- no build has been run yet.
# from the Actions tab. STATUS: UNVERIFIED -- the repo was read, but no build has been run.

permissions:
  contents: write   # lets the job create releases

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "filen-rs branch, tag or commit"
        default: "main"
      patch_tls:
        description: "Patch the SDK so Android uses bundled TLS roots instead of JNI (needed for a CLI)"
        type: boolean
        default: true

env:
  API_LEVEL: "24"   # Android 7.0+. Lower it (min 21) if the tablet runs older Android.
  TARGET: armv7-linux-androideabi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout filen-rs (with submodules)
        uses: actions/checkout@v4
        with:
          repository: FilenCloudDienste/filen-rs
          ref: ${{ inputs.ref }}
          submodules: recursive
          path: filen-rs

      - name: Patch TLS (Android build treated like desktop Linux for TLS)
        if: ${{ inputs.patch_tls }}
        working-directory: filen-rs
        run: |
          set -x
          # On target_os=android the SDK verifies certificates through JNI and fails every
          # handshake until an Android app hands it a JVM. A Termux CLI has no JVM.
          # Removing "android" from this list makes it use reqwest's bundled rustls roots.
          sed -i 's/\[&str; 5\] = \["windows", "macos", "linux", "ios", "android"\]/[\&str; 4] = ["windows", "macos", "linux", "ios"]/' filen-sdk-rs/build.rs
          git diff --stat
          git diff
          # Fail the job if the patch did not apply
          git diff --quiet && { echo "patch did not apply"; exit 1; } || true

      - name: Install the pinned Rust nightly and the armv7 Android target
        working-directory: filen-rs
        run: |
          set -x
          cat rust-toolchain.toml
          # Reads rust-toolchain.toml (a pinned nightly with rust-src)
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version --verbose

      - name: Point cargo and cc-rs at the Android NDK clang
        run: |
          set -x
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$BIN" | grep armv7a || { echo "NDK clang for armv7a not found"; exit 1; }
          {
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
            echo "CXX_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang++"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build filen-cli
        working-directory: filen-rs/filen-cli
        # The repo's .cargo/config.toml sets -Zhigher-ranked-assumptions for [build];
        # do NOT set RUSTFLAGS here, it would replace that (the nightly needs it).
        run: cargo build -v --release --locked --target "$TARGET"

      - name: Verify the binary is 32-bit ARM
        working-directory: filen-rs/filen-cli
        run: |
          set -x
          file "target/$TARGET/release/filen-cli" || file "../target/$TARGET/release/filen-cli"

      - name: Collect the binary
        run: |
          set -x
          mkdir -p out
          BIN=$(find filen-rs -path "*/$TARGET/release/filen-cli" -type f | head -n1)
          cp -v "$BIN" out/filen-cli-armv7-android
          ls -la out

      - name: Record the TLS patch (AGPL: source changes stay published)
        run: git -C filen-rs diff > out/tls-patch.diff; ls -la out

      - name: Publish a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          UPSTREAM=$(git -C filen-rs rev-parse --short HEAD)
          TAG="armv7-${UPSTREAM}-run${{ github.run_number }}"
          gh release create "$TAG" out/filen-cli-armv7-android out/tls-patch.diff \
            --repo "${{ github.repository }}" \
            --title "filen-cli armv7 (filen-rs ${UPSTREAM})" \
            --notes "Built from FilenCloudDienste/filen-rs @ ${UPSTREAM} (ref: ${{ inputs.ref }}), target ${TARGET}, Android API ${API_LEVEL}. TLS patch applied: ${{ inputs.patch_tls }} (see tls-patch.diff). Unofficial build, AGPL-3.0, source: https://github.com/FilenCloudDienste/filen-rs"
